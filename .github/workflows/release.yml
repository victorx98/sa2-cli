name: CLI release candidate

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          git merge-base --is-ancestor HEAD origin/main
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
  checks:
    needs: verify-tag
    uses: ./.github/workflows/ci.yml
    with:
      package: true
    secrets:
      SA2_API_READ_TOKEN: ${{ secrets.SA2_API_READ_TOKEN }}
  draft:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: sa2-*
          merge-multiple: true
          path: release-assets
      - name: Generate checksums and create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip --output=release-assets/agent-cli-usage.zip HEAD:skills
          cd release-assets
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            test -s "sa2_${GITHUB_REF_NAME}_$platform.tar.gz"
          done
          sha256sum ./*.tar.gz agent-cli-usage.zip > checksums.txt
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
            ./*.tar.gz agent-cli-usage.zip checksums.txt
