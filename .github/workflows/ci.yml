name: CLI checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-amd64, cgo: '0' }
          - { runner: macos-15-intel, platform: darwin-amd64, cgo: '1' }
          - { runner: windows-2025, platform: windows-amd64, cgo: '0', suffix: .exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting and contracts
        shell: bash
        run: |
          unformatted=$(gofmt -l cmd internal tools)
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          go mod tidy -diff
          go run ./tools/contract -check
      - run: go vet ./...
      - run: go test -count=1 ./...
      - if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      - name: Test GNOME Keyring on a private session bus
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus gnome-keyring
          bash scripts/test-linux-keyring.sh
      - name: Test macOS Keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p .cache
          sa2_keychain_dir=$(mktemp -d "$PWD/.cache/keychain.XXXXXX")
          sa2_keychain="$sa2_keychain_dir/test.keychain-db"
          sa2_original=$(security default-keychain -d user 2>/dev/null || true)
          sa2_original=$(printf '%s' "$sa2_original" | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          cleanup() {
            if [[ -n "$sa2_original" ]]; then
              security default-keychain -d user -s "$sa2_original"
            fi
            security delete-keychain "$sa2_keychain"
            rmdir "$sa2_keychain_dir"
          }
          trap cleanup EXIT
          sa2_test_password=$(uuidgen)
          security create-keychain -p "$sa2_test_password" "$sa2_keychain"
          security unlock-keychain -p "$sa2_test_password" "$sa2_keychain"
          security default-keychain -d user -s "$sa2_keychain"
          SA2_TEST_NATIVE_VAULT=1 go test -count=1 ./internal/session -run '^TestNativeVault$'
      - name: Test Windows Credential Manager
        if: runner.os == 'Windows'
        env:
          SA2_TEST_NATIVE_VAULT: '1'
        run: go test -count=1 ./internal/session -run "^TestNativeVault$"
      - name: Build and run the executable
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          SA2_BINARY: sa2${{ matrix.suffix }}
        run: |
          mkdir -p dist
          go build -trimpath -o "dist/$SA2_BINARY" ./cmd/sa2
          test "$(./dist/"$SA2_BINARY" --version | tr -d '\r')" = dev
          ./dist/"$SA2_BINARY" --help

  upstream-contract:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Select contract verification mode
        id: source
        env:
          SA2_API_READ_TOKEN: ${{ secrets.SA2_API_READ_TOKEN }}
        run: |
          if [[ -z "$SA2_API_READ_TOKEN" ]]; then
            echo 'upstream=false' >> "$GITHUB_OUTPUT"
            echo '::notice::SA2_API_READ_TOKEN is unset. Verifying the checked-in OpenAPI snapshot only.'
            exit 0
          fi
          echo 'upstream=true' >> "$GITHUB_OUTPUT"
          jq -r '"repository="+.repository, "commit="+.commit' contracts/source.json >> "$GITHUB_OUTPUT"
      - name: Check out the pinned private API source
        if: steps.source.outputs.upstream == 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.commit }}
          token: ${{ secrets.SA2_API_READ_TOKEN }}
          path: .contract-source
          persist-credentials: false
      - name: Verify the upstream blob and projection
        if: steps.source.outputs.upstream == 'true'
        run: |
          api_document=$(jq -r .path contracts/source.json)
          go run ./tools/contract -check -source ".contract-source/$api_document"
      - name: Verify the checked-in OpenAPI snapshot
        if: steps.source.outputs.upstream == 'false'
        run: go run ./tools/contract -check
